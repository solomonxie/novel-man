<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- open book -->
  <g>
    <!-- right page, slightly shaded so the spine reads as a fold -->
    <path d="M 874 372 Q 694 356 512 430 L 512 762 Q 694 700 874 702 Z" fill="#DCD5C6"/>
    <!-- left page -->
    <path d="M 150 372 Q 330 356 512 430 L 512 762 Q 330 700 150 702 Z" fill="#F7F3EA"/>
    <!-- text lines, faint enough to blur into tone at small sizes -->
    <g stroke="#5C6070" stroke-width="15" stroke-linecap="round" opacity="0.30">
      <line x1="228" y1="470" x2="440" y2="505"/>
      <line x1="228" y1="537" x2="440" y2="572"/>
      <line x1="228" y1="604" x2="398" y2="632"/>
    </g>
    <g stroke="#5C6070" stroke-width="15" stroke-linecap="round" opacity="0.22">
      <line x1="584" y1="505" x2="796" y2="470"/>
      <line x1="584" y1="572" x2="796" y2="537"/>
      <line x1="584" y1="632" x2="754" y2="604"/>
    </g>
    <!-- spine -->
    <path d="M 512 430 L 512 762" stroke="#B9B1A0" stroke-width="12" stroke-linecap="round" fill="none"/>
  </g>

  <!-- the cast the book is read for: three figures, linked -->
  <g stroke="#6FA0FF" stroke-width="16" stroke-linecap="round" opacity="0.85" fill="none">
    <line x1="386" y1="268" x2="512" y2="208"/>
    <line x1="638" y1="268" x2="512" y2="208"/>
    <line x1="386" y1="268" x2="638" y2="268"/>
  </g>
  <g fill="#6FA0FF">
    <circle cx="512" cy="208" r="52"/>
    <circle cx="386" cy="268" r="40"/>
    <circle cx="638" cy="268" r="40"/>
  </g>
</svg>
